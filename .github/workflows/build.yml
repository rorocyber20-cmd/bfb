name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
          libffi-dev libssl-dev build-essential ccache
        pip install --upgrade buildozer "cython<3" setuptools

    - name: Install fixed signing key
      env:
        DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      run: |
        if [ -z "$DEBUG_KEYSTORE_B64" ]; then
          echo "::error::Secret DEBUG_KEYSTORE_B64 is missing. Add it in Settings > Secrets and variables > Actions."
          exit 1
        fi
        mkdir -p ~/.android
        echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

    - name: Build APK
      run: yes | buildozer -v android debug

    - name: Show signing fingerprint (safe to share)
      run: keytool -printcert -jarfile bin/*.apk | grep -i "SHA256" || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BFB-Reminder-APK
        path: bin/*.apk
